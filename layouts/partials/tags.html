{{ $taxonomy := "tags" }}
{{ $visible_tags := slice }}
{{ range (.GetTerms $taxonomy) }}
  {{ if ne (lower .LinkTitle) "source externe" }}
    {{ $visible_tags = $visible_tags | append . }}
  {{ end }}
{{ end }}
{{ if $visible_tags }}
  <div class="article-tags">
    {{ range $visible_tags }}
      <a class="badge badge-light" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
    {{ end }}
  </div>
{{ end }}
