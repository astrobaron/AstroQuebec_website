name: Update seminar list

on:
  schedule:
    - cron: '0 20 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-seminars:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Import seminars from Google Sheet
        run: python3 scripts/import_seminars.py --url "https://docs.google.com/spreadsheets/d/1ZFOU0qNz010exBnI2UC_IALXu3Kdp9gDFC_SuSLUScs/export?format=csv&gid=0"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/event
          if git diff --cached --quiet; then
            echo "No seminar updates to commit."
            exit 0
          fi
          git commit -m "Update seminar pages from Google Sheet"
          git push
