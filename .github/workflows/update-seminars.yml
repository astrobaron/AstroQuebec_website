name: Update seminar list

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-seminars:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install seminar import dependencies
        run: python3 -m pip install openpyxl

      - name: Import seminars from the two sources
        run: |
          python3 scripts/import_seminars.py \
            --url "https://docs.google.com/spreadsheets/d/1ZFOU0qNz010exBnI2UC_IALXu3Kdp9gDFC_SuSLUScs/export?format=csv&gid=0" \
            --url "https://docs.google.com/spreadsheets/d/e/2PACX-1vTQuijtqP317H2sYk84mriq9OTQhW624Jwn0RH5nv1OHdKsKTYggxKFnax9GAjG2dkT8OxH7825VrSW/pub?output=csv"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/event
          if git diff --cached --quiet; then
            echo "No seminar updates to commit."
            exit 0
          fi
          git pull --rebase origin "${GITHUB_REF#refs/heads/}"
          git commit -m "Update seminar pages from Google Sheet"
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"
